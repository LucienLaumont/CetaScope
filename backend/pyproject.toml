[project]
name = "cetascope-backend"
version = "0.1.0"
description = "CetaScope FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "cetascope-shared",
]

[tool.uv.sources]
cetascope-shared = { path = "../shared" }
